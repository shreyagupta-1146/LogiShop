# The real database server (PostgreSQL 16) and its web admin tool (pgAdmin 4).
#   docker compose -f deploy/docker-compose.yml up -d
# Independent of any other project on this machine: own containers, own volume, own network,
# host ports 5433 (PostgreSQL) and 5050 (pgAdmin), both bound to localhost only.
name: logistics

services:
  db:
    image: postgres:16-alpine
    container_name: logistics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres          # superuser, local demo only; the app uses its own limited role
      POSTGRES_DB: logistics
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - logistics_pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements   # "top queries" statistics
      - -c
      - log_statement=all                             # the server logs EVERY statement it receives ...
      - -c
      - log_line_prefix=%m %u@%d [%a] %q              # ... with time, role@database and the application_name of the sender
      - -c
      - log_timezone=Asia/Kolkata
      - -c
      - timezone=UTC
      - -c
      - log_min_messages=warning
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logistics"]
      interval: 3s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: logistics-pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@logistics-demo.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"             # single-user desktop mode: no login screen
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgpass.src:ro
      - logistics_pgadmin:/var/lib/pgadmin
    # pgAdmin only accepts a password file that is private to its user: copy + chmod, then start as usual
    entrypoint: ["/bin/sh", "-c", "mkdir -p /var/lib/pgadmin && cp /pgpass.src /var/lib/pgadmin/pgpass && chmod 600 /var/lib/pgadmin/pgpass && exec /entrypoint.sh"]

volumes:
  logistics_pgdata:
  logistics_pgadmin:
